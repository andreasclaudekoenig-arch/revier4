const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(P.s),iterations:P.n},base,256));
}
(async()=>{const s=localStorage.getItem(K);if(s){try{await open_(u8(s));return}catch(e){localStorage.removeItem(K)}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
  b.disabled=true;b.textContent='Prüfe …';er.textContent='';
  try{const keep=document.getElementById('keep').checked;const raw=await derive(document.getElementById('pw').value);
    try{await open_(raw)}catch(x){throw 'pw'}
    if(keep) localStorage.setItem(K,btoa(String.fromCharCode(...raw)));
  }catch(x){er.textContent='Falsches Passwort.';b.disabled=false;b.textContent='Öffnen'}
});
